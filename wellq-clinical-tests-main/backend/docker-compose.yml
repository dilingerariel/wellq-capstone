# Configuration template only. No database/index/replica-set migration is automatic.
services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/run/mongo/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    volumes:
      - mongodb_data:/data/db
      - ${MONGO_KEYFILE_PATH:?required}:/run/mongo/keyfile:ro
    networks: [wellq-network]
  fastapi:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      WELLQ_DEBUG: "false"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [wellq-network]
volumes:
  mongodb_data:
networks:
  wellq-network:
